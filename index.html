
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Independence Day Card Maker</title>

<style>
*{ 
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#01411C,#00A651);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    text-align:center;
    width:100%;
    max-width:400px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#01411C;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#006400;
}

#card{
    margin-top:20px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.header{
    background:#01411C;
    color:#fff;
    padding:20px;
}

.flag{
    width:220px;
    height:130px;
    margin:20px auto;
    background:linear-gradient(to right,#fff 25%,#01411C 25%);
    position:relative;
    border:2px solid #ccc;
}

.moon{
    width:55px;
    height:55px;
    background:#fff;
    border-radius:50%;
    position:absolute;
    top:35px;
    left:95px;
}

.moon:after{
    content:"";
    width:45px;
    height:45px;
    background:#01411C;
    border-radius:50%;
    position:absolute;
    left:12px;
    top:5px;
}

.star{
    position:absolute;
    color:#fff;
    font-size:24px;
    top:35px;
    left:145px;
    transform:rotate(20deg);
}

.photo{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #01411C;
    margin:10px auto;
    display:none;
}

.name{
    font-size:28px;
    font-weight:bold;
    color:#01411C;
    margin:10px;
}

.message{
    padding:15px;
    color:#444;
    font-size:18px;
}

.footer{
    background:#f2f2f2;
    padding:10px;
    color:#01411C;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<input type="text" id="userName" placeholder="Apna Naam Likhein">

<input type="file" id="imageUpload" accept="image/*">

<button onclick="generateCard()">Card Banayein</button>
<button onclick="downloadCard()">Download Card</button>

<div id="card">

<div class="header">
<h1>🇵🇰 Happy Independence Day 🇵🇰</h1>
</div>

<div class="flag">
<div class="moon"></div>
<div class="star">★</div>
</div>

<img id="cardImage" class="photo">

<div class="name" id="showName">
Your Name
</div>

<div class="message">
14 August Mubarak! 🇵🇰<br>
Allah Pakistan ko taraqqi, aman aur khushhali ata farmaye (AMEEN).
</div>

<div class="footer">
❤️ Pakistan Zindabad ❤️
</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

document.getElementById("imageUpload").addEventListener("change",function(e){

const file=e.target.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(event){

const img=document.getElementById("cardImage");

img.src=event.target.result;
img.style.display="block";

}

reader.readAsDataURL(file);

}

});

function generateCard(){

let name=document.getElementById("userName").value;

if(name===""){
alert("Apna Naam Likhein");
return;
}

document.getElementById("showName").innerText=name;

}

function downloadCard(){

html2canvas(document.getElementById("card")).then(canvas=>{

let link=document.createElement("a");

link.download="Happy-Independence-Day-Card.png";
link.href=canvas.toDataURL("image/png");
link.click();

});

}

</script>

</body>
</html>
